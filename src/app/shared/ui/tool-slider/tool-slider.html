<div class="d:flex flex:col w:100% gap:6">
  @if (label()) {
    <div class="d:flex justify-content:space-between align-items:center f:12 font-family:var(--font-mono)">
      <span class="color:var(--ink-bright) font-weight:600">&gt; {{ label() }}</span>
      @if (showValue()) {
        <span class="color:var(--primary) font-weight:600">
          {{ formattedValue() }}
        </span>
      }
    </div>
  }

  <div class="position:relative w:100% d:flex flex:col">
    <input
      type="range"
      [min]="min()"
      [max]="max()"
      [step]="step()"
      [value]="value()"
      (input)="updateValue(+$any($event.target).value)"
      class="dt-slider w:100%"
      [style.background]="'linear-gradient(to right, var(--primary) 0%, var(--primary) ' + percentage() + '%, var(--border-muted) ' + percentage() + '%, var(--border-muted) 100%)'"
      [attr.aria-label]="ariaLabel() || label()"
    />
    @if (ticks().length > 0) {
      <div class="position:relative w:100% h:16 mt:4 user-select:none font-family:var(--font-mono) f:11">
        @for (tick of ticks(); track tick) {
          <span
            class="slider-tick position:absolute cursor:pointer transition:color|0.1s|ease color:ink-disabled color:primary.is-active font-weight:600.is-active"
            [class.is-active]="value() >= tick"
            [style.left.%]="getTickPercent(tick)"
            [style.transform]="getTickTransform(tick)"
            (click)="updateValue(tick)"
          >
            {{ tick }}
          </span>
        }
      </div>
    }
  </div>
</div>
